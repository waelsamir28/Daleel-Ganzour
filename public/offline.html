<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0877e6">
    <title>غير متصل بالإنترنت | دليل جنزور</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf5ff,#f7fbff);color:#153451;font-family:Arial,Tahoma,sans-serif;text-align:center}.card{max-width:420px;padding:36px 28px;border:1px solid #dbeafe;border-radius:24px;background:#fff;box-shadow:0 18px 60px #125ba51c}.mark{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 20px;border-radius:22px;background:linear-gradient(145deg,#0c95f3,#075fd0);color:#fff;font-size:34px;font-weight:900}.card h1{margin:0 0 12px;font-size:25px}.card p{margin:0;color:#5a7186;font-size:15px;line-height:2}.card a{display:inline-block;margin-top:24px;padding:12px 22px;border-radius:12px;background:#0877e6;color:#fff;font-weight:800;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">ج</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يحتاج دليل جنزور إلى اتصال بالإنترنت لعرض أحدث بيانات الخدمات. تأكد من اتصالك، ثم أعد المحاولة.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
