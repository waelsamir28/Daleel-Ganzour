<svg xmlns="http://www.w3.org/2000/svg">
  <!-- رسومات ثلاثية الأبعاد بأسلوب "مرسوم باليد" لأهم 12 مهنة في جنزور. كل رمز 128×128 ويُستدعى عبر <use href="/images/profession-art.svg#id">. -->
  <defs>
    <filter id="sketch" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- 1) كهربائي: برق + شرارات -->
  <symbol id="electricity" viewBox="0 0 128 128">
